name: Windows

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'windows/**'
      - 'Resources/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the app
        run: dotnet build windows/PiggyPet.Windows/PiggyPet.Windows.csproj -c Release

      - name: Check the stroll and manifest logic
        run: dotnet run --project windows/tests/PiggyPet.LogicTests -c Release

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content windows/PiggyPet.Windows/PiggyPet.Windows.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version

          $out = 'windows/PiggyPet.Windows/bin/Release/net48'
          $stage = 'build/win/PiggyPet'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "$out/PiggyPet.exe" $stage
          Copy-Item "$out/PiggyPet.exe.config" $stage
          Copy-Item "$out/manifest.json" $stage
          Copy-Item -Recurse "$out/sprites", "$out/walk", "$out/run" $stage
          Copy-Item 'windows/README-Windows.txt' $stage

          $zip = "build/win/PiggyPet-$version-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "build/win/PiggyPet-$version-windows-x64-checksums.txt"

          Get-ChildItem build/win
          Write-Output "built $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PiggyPet-windows-x64
          path: |
            build/win/*.zip
            build/win/*-checksums.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          # The release itself is created by hand right after the tag is
          # pushed; give it a few minutes to show up.
          for ($i = 0; $i -lt 30; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          gh release upload $tag (Get-ChildItem build/win/*.zip).FullName (Get-ChildItem build/win/*-checksums.txt).FullName --clobber
